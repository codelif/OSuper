name: Build report

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/report.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/report.yml"]
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile synopsis and report
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs
          root_file: |
            synopsis.tex
            report.tex

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: osuper-docs
          path: |
            docs/report.pdf
            docs/synopsis.pdf
